version: 2

models:
  - name: dim_customers
    description: Ringkasan aktivitas rental dan pembayaran per customer.
    columns:
      - name: customer_id
        description: ID unik customer.
        data_tests:
          - not_null
          - unique

  - name: dim_films
    description: Ringkasan film beserta kategori, rating, inventory, dan aktivitas rental.
    columns:
      - name: film_id
        description: ID unik film.
        data_tests:
          - not_null
          - unique

  - name: fact_payments
    description: Transaksi pembayaran yang dilengkapi informasi customer, store, rental, dan film.
    columns:
      - name: payment_id
        description: ID unik pembayaran.
        data_tests:
          - not_null
          - unique

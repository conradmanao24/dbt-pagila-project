version: 2

models:
  - name: mart_customer_performance
    description: Ringkasan performa customer berdasarkan rental dan total pembayaran.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: mart_daily_revenue
    description: Ringkasan pembayaran dan revenue harian per store.
    columns:
      - name: paid_date
        data_tests:
          - not_null
      - name: store_id
        data_tests:
          - not_null

  - name: mart_film_performance
    description: Ringkasan performa film berdasarkan aktivitas rental dan revenue.
    columns:
      - name: film_id
        data_tests:
          - not_null
          - unique

  - name: mart_similar_films
    description: Lima film paling mirip untuk setiap film berdasarkan cosine similarity dari pgvector.
    columns:
      - name: film_id
        data_tests:
          - not_null
      - name: similar_film_id
        data_tests:
          - not_null
      - name: similarity_rank
        data_tests:
          - not_null

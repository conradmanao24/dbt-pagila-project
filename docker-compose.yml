services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: dbt_pagila_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pagila}
    ports:
      - "15432:5432"
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pagila}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dbgate:
    image: dbgate/dbgate
    container_name: dbt_pagila_dbgate
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "15424:3000"
    environment:
      CONNECTIONS: pagila
      LABEL_pagila: "Pagila"
      SERVER_pagila: postgres
      USER_pagila: ${POSTGRES_USER:-postgres}
      PASSWORD_pagila: ${POSTGRES_PASSWORD:-postgres}
      PORT_pagila: "5432"
      ENGINE_pagila: postgres@dbgate-plugin-postgres
    volumes:
      - dbgate_data:/root/.dbgate

volumes:
  postgres_data:
  dbgate_data:

